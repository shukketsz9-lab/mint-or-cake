<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>민트초코 or 케이크</title>
    <style>
        :root {
            --table-color: #8B4513;
            --bg-color: #f0f0f0;
        }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        h1 { margin: 10px; font-size: 3.5rem; color: #333; text-shadow: 2px 2px #ccc; }
        
        #timer-container {
            width: 80%;
            height: 35px;
            background: #ddd;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 4px solid #333;
            overflow: hidden;
        }
        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #ff4e50, #f9d423);
            transition: width 0.1s linear;
        }

        #game-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 1000px;
            height: 600px;
        }

        .character-box {
            width: 300px;
            text-align: center;
        }
        .character-box img {
            width: 100%;
            height: auto;
            border-radius: 15px;
        }

        #center-zone {
            position: relative;
            width: 350px;
            height: 220px;
            background-color: var(--table-color);
            border-radius: 20px;
            box-shadow: 0 12px 0 #5D2E0A;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #food-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .food {
            position: absolute;
            width: 120px;
            height: 120px;
            object-fit: contain;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .fly-left {
            left: -200px !important;
            opacity: 0;
            transform: translate(-50%, -50%) rotate(-360deg) scale(0.5) !important;
        }
        .fly-right {
            left: calc(100% + 200px) !important;
            opacity: 0;
            transform: translate(-50%, -50%) rotate(360deg) scale(0.5) !important;
        }

        #score { font-size: 2.5rem; margin: 10px; font-weight: bold; color: #222; }
        #start-btn, #restart-btn {
            padding: 20px 50px;
            font-size: 1.8rem;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 0 #2E6B31;
            transition: 0.1s;
        }
        #start-btn:active, #restart-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2E6B31; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .hidden { display: none !important; }

        #help { margin-top: 30px; color: #444; font-size: 1.2rem; background: #fff; padding: 10px 20px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 카운트다운 스타일 추가 */
        #countdown-display {
            position: absolute;
            font-size: 8rem;
            font-weight: bold;
            color: #ff4e50;
            text-shadow: 4px 4px 0px #333;
            z-index: 200;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>민트초코 or 케이크</h1>

    <div id="score">Score: 0</div>

    <div id="timer-container">
        <div id="timer-bar"></div>
    </div>

    <div id="game-area">
        <div class="character-box">
            <img id="joanne" src="resources/joanne.gif" alt="Joanne">
        </div>

        <div id="center-zone">
            <div id="food-container"></div>
            <button id="start-btn">게임 시작</button>
            <div id="countdown-display" class="hidden"></div>
        </div>

        <div class="character-box">
            <img id="erpin" src="resources/erpin.gif" alt="Erpin">
        </div>
    </div>

    <div id="help">
        <b>민트초코가 나왔다면 왼쪽 방향키를 눌러 죠안에게 주세요!</b> | <b>케이크가 나왔다면 오른쪽 방향키를 눌러 에르핀에게 주세요!</b>
    </div>

    <div id="overlay" class="hidden">
        <h2 id="final-score-text" style="font-size: 4rem; color: #d32f2f;"></h2>
        <button id="restart-btn">다시 하기</button>
    </div>

    <script>
        const joanneImg = document.getElementById('joanne');
        const erpinImg = document.getElementById('erpin');
        const foodContainer = document.getElementById('food-container');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const timerBar = document.getElementById('timer-bar');
        const scoreDisplay = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const finalScoreText = document.getElementById('final-score-text');
        const countdownDisplay = document.getElementById('countdown-display');

        // 오디오 객체 생성
        const flySound = new Audio('resources/날아가는소리.mp3');
        const erpinCrySound = new Audio('resources/에르핀우는소리.mp3');
        const joanneTrialSound = new Audio('resources/이런시련을던져주시다니.mp3');

        let score = 0;
        let timeLeft = 10;
        let gameActive = false;
        let currentFoodType = null;
        let timerInterval;

        // 카운트다운 함수 추가
        function startCountdown() {
            startBtn.classList.add('hidden');
            overlay.classList.add('hidden');
            countdownDisplay.classList.remove('hidden');
            let count = 3;
            countdownDisplay.textContent = count;

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.textContent = count;
                } else if (count === 0) {
                    countdownDisplay.textContent = "GO!";
                } else {
                    clearInterval(countInterval);
                    countdownDisplay.classList.add('hidden');
                    initGame(); // 실제 게임 시작
                }
            }, 1000);
        }

        function initGame() {
            score = 0;
            timeLeft = 10;
            scoreDisplay.textContent = `Score: ${score}`;
            overlay.classList.add('hidden');
            startBtn.classList.add('hidden');
            gameActive = true;
            spawnFood();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft -= 0.05;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                }
                timerBar.style.width = (timeLeft / 10) * 100 + "%";
            }, 50);
        }

        function spawnFood() {
            if (!gameActive) return;
            foodContainer.innerHTML = '';
            currentFoodType = Math.random() > 0.5 ? 'mint' : 'cake';
            const food = document.createElement('img');
            food.src = currentFoodType === 'mint' ? 'resources/fuck.png' : 'resources/cake.png';
            food.className = 'food';
            food.id = 'active-food';
            foodContainer.appendChild(food);
        }

        function handleInput(direction) {
            if (!gameActive) return;
            const food = document.getElementById('active-food');
            if (!food || food.classList.contains('fly-left') || food.classList.contains('fly-right')) return;

            // 1. 방향키 입력 시 날아가는 소리 재생
            flySound.currentTime = 0; 
            flySound.play();

            if (direction === 'left') {
                food.classList.add('fly-left');
                checkLogic('joanne');
            } else if (direction === 'right') {
                food.classList.add('fly-right');
                checkLogic('erpin');
            }

            setTimeout(spawnFood, 50);
        }

        function checkLogic(target) {
            if (target === 'joanne') {
                if (currentFoodType === 'mint') {
                    updateScore(1, 0.4);
                    changeEmotion(joanneImg, 'resources/eatingjoanne.gif', 'resources/joanne.gif');
                } else {
                    // 3. 케이크를 죠안에게 주면 시련 소리 재생
                    joanneTrialSound.currentTime = 0;
                    joanneTrialSound.play();
                    updateScore(-1, -1.0);
                    changeEmotion(joanneImg, 'resources/madjoanne.gif', 'resources/joanne.gif');
                }
            } else if (target === 'erpin') {
                if (currentFoodType === 'cake') {
                    updateScore(1, 0.4);
                    changeEmotion(erpinImg, 'resources/eatingerpin.gif', 'resources/erpin.gif');
                } else {
                    // 2. 민트초코를 에르핀에게 주면 우는 소리 재생
                    erpinCrySound.currentTime = 0;
                    erpinCrySound.play();
                    updateScore(-1, -1.0);
                    changeEmotion(erpinImg, 'resources/maderpin.gif', 'resources/erpin.gif');
                }
            }
        }

        function updateScore(points, timeMod) {
            score += points;
            timeLeft = Math.max(0, Math.min(10, timeLeft + timeMod));
            scoreDisplay.textContent = `Score: ${score}`;
        }

        function changeEmotion(element, tempSrc, originalSrc) {
            element.src = tempSrc;
            setTimeout(() => {
                if (gameActive) element.src = originalSrc;
            }, 2000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            timerBar.style.width = "0%";
            finalScoreText.textContent = `최종 점수: ${score}`;
            overlay.classList.remove('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') handleInput('left');
            if (e.key === 'ArrowRight') handleInput('right');
        });

        // 시작 버튼 클릭 시 카운트다운부터 실행
        startBtn.addEventListener('click', startCountdown);
        restartBtn.addEventListener('click', startCountdown);
    </script>
</body>
</html>
